# Default project settings. Do NOT put real personal coordinates here.
# Override any value in config/local.yaml (gitignored).

random_seed: 42

# Example observer: a generic public location (Istanbul city centre).
observer:
  name: example
  lat_deg: 41.01
  lon_deg: 28.98
  alt_m: 40.0

# Satellite used in Phase 0 (ISS, NORAD catalog number 25544).
satellite:
  name: ISS (ZARYA)
  norad_id: 25544
  downlink_freq_hz: 145800000 # FM voice downlink (SatNOGS DB, checked 2026-11-26)

tle:
  cache_dir: data/tle
  max_age_days: 1.0
